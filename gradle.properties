# ============================================================
# 予你 · Us 的 Gradle 全局参数
# 数值参考本机已验证的轻记工程（16G 内存、Windows、非 OneDrive 目录）
# ============================================================
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# 本机关掉 build cache：
# 2026-11-16 在轻记工程实测，FROM-CACHE 解包阶段会卡死在 FileOutputStream.open0，
# 线程 RUNNABLE 但 CPU 不动，表现为"编译卡死"。关掉后真正重新执行，慢一点但不卡。
org.gradle.caching=false

# Kotlin 编译守护进程单独给堆；不给的话可能按默认大堆申请而在本机启动失败
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
